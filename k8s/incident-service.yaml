apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-service
  namespace: mindcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-service
  template:
    metadata:
      labels:
        app: incident-service
    spec:
      containers:
        - name: incident-service
          image: mindcare/incident-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka:8761/eureka"
            - name: INCIDENT_DB_URL
              value: "jdbc:mysql://mysql:3306/incident_db?createDatabaseIfNotExist=true"
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              value: ""
---
apiVersion: v1
kind: Service
metadata:
  name: incident-service
  namespace: mindcare
spec:
  selector:
    app: incident-service
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP
