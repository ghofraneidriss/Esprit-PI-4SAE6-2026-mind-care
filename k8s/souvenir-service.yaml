apiVersion: apps/v1
kind: Deployment
metadata:
  name: souvenir-service
  namespace: mindcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: souvenir-service
  template:
    metadata:
      labels:
        app: souvenir-service
    spec:
      containers:
        - name: souvenir-service
          image: mindcare/souvenir-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8086
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka:8761/eureka"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/souvenir_db?createDatabaseIfNotExist=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              value: ""
---
apiVersion: v1
kind: Service
metadata:
  name: souvenir-service
  namespace: mindcare
spec:
  selector:
    app: souvenir-service
  ports:
    - port: 8086
      targetPort: 8086
  type: ClusterIP
