apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordonnance-et-medicaments
  namespace: mindcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ordonnance-et-medicaments
  template:
    metadata:
      labels:
        app: ordonnance-et-medicaments
    spec:
      containers:
        - name: ordonnance-et-medicaments
          image: mindcare/ordonnance-et-medicaments:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka:8761/eureka"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/alzheimer_db?createDatabaseIfNotExist=true&useSSL=false"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              value: ""
---
apiVersion: v1
kind: Service
metadata:
  name: ordonnance-et-medicaments
  namespace: mindcare
spec:
  selector:
    app: ordonnance-et-medicaments
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP
