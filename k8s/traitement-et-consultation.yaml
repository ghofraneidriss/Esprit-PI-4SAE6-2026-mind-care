apiVersion: apps/v1
kind: Deployment
metadata:
  name: traitement-et-consultation
  namespace: mindcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traitement-et-consultation
  template:
    metadata:
      labels:
        app: traitement-et-consultation
    spec:
      containers:
        - name: traitement-et-consultation
          image: mindcare/traitement-et-consultation:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8089
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka:8761/eureka"
            - name: SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING
              value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: traitement-et-consultation
  namespace: mindcare
spec:
  selector:
    app: traitement-et-consultation
  ports:
    - protocol: TCP
      port: 8089
      targetPort: 8089
  type: ClusterIP
