apiVersion: apps/v1
kind: Deployment
metadata:
  name: volunteer
  namespace: mindcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volunteer
  template:
    metadata:
      labels:
        app: volunteer
    spec:
      containers:
        - name: volunteer
          image: mindcare/volunteer:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8085
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka:8761/eureka"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/volunteer_db?createDatabaseIfNotExist=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              value: ""
---
apiVersion: v1
kind: Service
metadata:
  name: volunteer
  namespace: mindcare
spec:
  selector:
    app: volunteer
  ports:
    - port: 8085
      targetPort: 8085
  type: ClusterIP
