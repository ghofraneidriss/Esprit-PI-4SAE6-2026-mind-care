apiVersion: apps/v1
kind: Deployment
metadata:
  name: volunteer
  namespace: mindcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volunteer
  template:
    metadata:
      labels:
        app: volunteer
    spec:
      containers:
        - name: volunteer
          image: mindcare/volunteer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka:8761/eureka"
            - name: SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING
              value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: volunteer
  namespace: mindcare
spec:
  selector:
    app: volunteer
  ports:
    - protocol: TCP
      port: 8085
      targetPort: 8085
  type: ClusterIP
