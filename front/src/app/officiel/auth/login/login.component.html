<div class="auth-page">
  <div class="auth-card">
    <a routerLink="/" class="back-home">← Mind Care</a>
    <div class="auth-header">
      <div class="auth-icon">🧠</div>
      <h2>Sign in</h2>
      <p>Access your Mind Care space</p>
    </div>
    <div *ngIf="error" class="alert error">⚠️ {{ error }}</div>
    <form (ngSubmit)="submit()">
      <div class="field">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="you@email.com" />
      </div>
      <div class="field">
        <label>Role</label>
        <select [(ngModel)]="role" name="role" required>
          <option *ngFor="let r of roles" [ngValue]="r.value">{{ r.label }}</option>
        </select>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="pwd-wrap">
          <input [type]="showPwd?'text':'password'" [(ngModel)]="password" name="password" placeholder="••••••" />
          <button type="button" class="eye" (click)="showPwd=!showPwd">{{showPwd?'🙈':'👁️'}}</button>
        </div>
      </div>
      <button type="submit" class="btn-submit" [disabled]="loading">
        <span *ngIf="!loading">Sign in</span><span *ngIf="loading" class="spin"></span>
      </button>
    </form>
    <p class="switch-link">No account yet? <a routerLink="/officiel/register">Create an account</a></p>
    <div class="quick-fill">
      <span>Quick test:</span>
      <button type="button" (click)="fill('admin@alzcare.com','Admin@123','ADMIN')">Admin</button>
      <button type="button" (click)="fill('caregiver@alzcare.com','Caregiver@123','CAREGIVER')">Caregiver</button>
      <button type="button" (click)="fill('doctor@alzcare.com','Doctor@123','DOCTOR')">Doctor</button>
      <button type="button" (click)="fill('patient1@alzcare.com','Patient@123','PATIENT')">Patient</button>
    </div>
  </div>
</div>
